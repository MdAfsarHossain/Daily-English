<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Use English Sentences – স্পোকেন ইংলিশ প্র্যাকটিস</title>
<meta name="description" content="৯৪টি অধ্যায়ে 7000+ দৈনন্দিন ইংরেজি বাক্য — বাংলা উচ্চারণ ও অর্থসহ। শুনুন, বলুন, অনুশীলন করুন।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6fb; --card:#fff; --ink:#1d1b2e; --muted:#6b6a80; --line:#e7e5f2;
  --brand:#5b4bdb; --brand2:#8a5cf6; --brand-soft:#eeebff; --ok:#16a34a; --ok-soft:#e3f7ea;
  --shadow:0 1px 2px rgba(30,20,80,.05),0 8px 24px rgba(30,20,80,.06);
}
:root[data-theme="dark"]{
  --bg:#12111c; --card:#1b1a29; --ink:#ecebf7; --muted:#9a98b4; --line:#2b2a40;
  --brand:#8b7dff; --brand2:#b18cff; --brand-soft:#26234a; --ok:#4ade80; --ok-soft:#173326;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter','Hind Siliguri','Bangla Sangam MN',system-ui,sans-serif;line-height:1.5}
.bn,.pr,h1,h2,h3,.bnfont{font-family:'Hind Siliguri','Inter','Bangla Sangam MN',sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-style:normal;font-size:16px}
.bar .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.pill:hover{border-color:var(--brand)}

/* hero */
.hero{padding:56px 0 30px;text-align:center}
.hero h1{font-size:clamp(30px,5.5vw,52px);line-height:1.12;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:620px;color:var(--muted);font-size:18px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:26px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--brand)}
.stat small{color:var(--muted)}
.search{position:relative;max-width:560px;margin:26px auto 0}
.search input{width:100%;padding:15px 18px 15px 46px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--brand)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.cta{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:600;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 18px rgba(91,75,219,.3)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}

/* home grid */
.sec-title{font-size:22px;margin:34px 0 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.part{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.part header{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.badge{flex:none;min-width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800}
.part h3{margin:0;font-size:17px;line-height:1.3}
.part small{color:var(--muted)}
.chl a{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:9px;font-size:15px}
.chl a:hover{background:var(--brand-soft)}
.chl a em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.chl a.done em{color:var(--ok)}

/* chapter */
.crumb{margin:22px 0 6px;color:var(--muted);font-size:14px}
.crumb a:hover{color:var(--brand)}
.ch-head h1{margin:2px 0 4px;font-size:clamp(24px,4vw,34px);font-weight:800}
.ch-head p{margin:0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;position:sticky;top:58px;z-index:10;padding:10px 0;background:var(--bg)}
.tog{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.tog[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px;margin-bottom:24px}
@media(max-width:520px){.list{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:minmax(0,1fr)}}
.s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px 14px;display:flex;gap:12px}
.s.known{background:var(--ok-soft);border-color:transparent}
.no{flex:none;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:700;display:grid;place-items:center}
.s .body{flex:1;min-width:0}
.en{font-size:18px;font-weight:600;line-height:1.35}
.pr{color:var(--brand);font-style:italic;margin-top:2px;font-size:15px}
.bnm{margin-top:3px;font-size:16px;font-weight:500;font-family:'Hind Siliguri',sans-serif}
.hide-pr .pr{display:none}
.hide-bn .bnm{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .2s}
.hide-bn .bnm.show{filter:none}
.hide-en .en{filter:blur(7px);cursor:pointer;user-select:none}
.hide-en .en.show{filter:none}
.acts{display:flex;flex-direction:column;gap:6px}
.ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:15px}
.ic:hover{border-color:var(--brand);color:var(--brand)}
.ic.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ic.speaking{background:var(--brand);color:#fff;border-color:var(--brand)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:8px 0 40px}
.res{margin-top:26px}
.res .s{margin-bottom:10px}
.res small{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);text-align:center;font-size:14px}
footer b{color:var(--ink)}
.hidden{display:none!important}
</style>
</head>
<body>

  <a class="logo" href="#/"><i>A</i><span>Daily English</span></a>
  <span class="sp"></span>
  <button class="pill" id="theme" title="Dark / light">◐ <span class="bnfont">থিম</span></button>
</div></div>

<main class="wrap" id="app"></main>

<script>

const TOTAL = 7000;
const app = document.getElementById('app');
const BN = '০১২৩৪৫৬৭৮৯';
const bn = n => String(n).replace(/\d/g, d => BN[d]);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chapters = DATA.flatMap(p => p.c.map(c => Object.assign({part: p}, c)));
const byNum = Object.fromEntries(chapters.map(c => [c.n, c]));

/* storage (safe) */
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};
let known = store.get('known', {});          // { "ch:idx": 1 }
let prefs = store.get('prefs', {pr:true, bn:true, en:true}); // true = visible
const isKnown = (c, i) => !!known[c + ':' + i];
const chDone = c => byNum[c].s.filter((_, i) => isKnown(c, i)).length;

/* theme */
const root = document.documentElement;
const savedTheme = store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
root.dataset.theme = savedTheme;
document.getElementById('theme').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', root.dataset.theme);
};

/* speech */
function speak(text, btn){
  if (!('speechSynthesis' in window)) { alert('এই ব্রাউজারে অডিও সাপোর্ট নেই।'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
  if (v) u.voice = v;
  document.querySelectorAll('.ic.speaking').forEach(b => b.classList.remove('speaking'));
  if (btn) { btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
  speechSynthesis.speak(u);
}

  </div>`;

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="বাক্য খুঁজুন — ইংরেজি বা বাংলায়…" autocomplete="off">
    </div>
    <div class="cta">
      <a class="btn" href="#/ch/1">প্রথম অধ্যায় থেকে শুরু করুন</a>
      <button class="btn ghost" id="rnd">🎲 এলোমেলো অধ্যায়</button>
    </div>
  </section>
  <div id="results" class="res hidden"></div>
  <div id="parts">
    <h2 class="sec-title">সূচিপত্র</h2>
    <div class="grid">${DATA.map(p => `
      <article class="part">
        <header><div class="badge">${bn(p.n)}</div>
          <div><h3>${esc(p.t)}</h3><small>${bn(p.c.length)}টি অধ্যায়</small></div></header>
        <div class="chl">${p.c.map(c => {
          const d = chDone(c.n);
          return `<a href="#/ch/${c.n}" class="${d===c.s.length?'done':''}"><span>${bn(c.n)}. ${esc(c.t)}</span><em>${d?bn(d)+'/':''}${bn(c.s.length)}</em></a>`;
        }).join('')}</div>
      </article>`).join('')}
    </div>
  </div>`;
  document.getElementById('rnd').onclick = () => { location.hash = '#/ch/' + (1 + Math.floor(Math.random() * chapters.length)); };
  const q = document.getElementById('q'), res = document.getElementById('results'), partsEl = document.getElementById('parts');
  let t;
  q.oninput = () => { clearTimeout(t); t = setTimeout(() => {
    const term = q.value.trim().toLowerCase();
    if (term.length < 2) { res.classList.add('hidden'); partsEl.classList.remove('hidden'); return; }
    const hits = [];
    for (const c of chapters) for (let i = 0; i < c.s.length; i++) {
      const s = c.s[i];
      if ((s[0] + ' ' + s[2]).toLowerCase().includes(term)) { hits.push([c, i, s]); if (hits.length >= 60) break; }
    }
    partsEl.classList.add('hidden'); res.classList.remove('hidden');
    res.innerHTML = `<h2 class="sec-title">${bn(hits.length)}${hits.length>=60?'+':''}টি ফলাফল</h2>` +
      (hits.length ? hits.map(([c,i,s]) => sentenceHTML(c.n, i, s).replace('<div class="body">', `<div class="body"><small><a href="#/ch/${c.n}">অধ্যায় ${bn(c.n)} · ${esc(c.t)}</a></small>`)).join('') : '<p class="bnfont">কিছু পাওয়া যায়নি।</p>');
  }, 150); };
  window.scrollTo(0, 0);
}

function chapter(n){
  const c = byNum[n];
  if (!c) { location.hash = '#/'; return; }
  const prev = byNum[n-1], next = byNum[n+1];
  app.innerHTML = `
  <div class="crumb"><a href="#/">সূচিপত্র</a> › পার্ট ${bn(c.part.n)} · ${esc(c.part.t)}</div>
  <div class="ch-head"><h1>অধ্যায় ${bn(c.n)} : ${esc(c.t)}</h1><p>${esc(c.e)} · ${bn(c.s.length)}টি বাক্য</p></div>
  <div class="tools">
    <button class="tog" data-t="pr" aria-pressed="${prefs.pr}">উচ্চারণ</button>
    <button class="tog" data-t="bn" aria-pressed="${prefs.bn}">বাংলা অর্থ</button>
    <button class="tog" data-t="en" aria-pressed="${prefs.en}">ইংরেজি</button>
    <button class="tog" id="all">▶ সব শুনুন</button>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <p class="bnfont" style="color:var(--muted);margin:4px 0 16px;font-size:14px"><span id="cnt"></span> · টিপস: অর্থ ঢেকে রেখে নিজে বলার চেষ্টা করুন, তারপর ঝাপসা অংশে ট্যাপ করে মিলিয়ে নিন।</p>
  <div class="list" id="list">${c.s.map((s, i) => sentenceHTML(c.n, i, s)).join('')}</div>
  <div class="nav">
    ${prev ? `<a class="btn ghost" href="#/ch/${prev.n}">← অধ্যায় ${bn(prev.n)}</a>` : '<span></span>'}
    ${next ? `<a class="btn" href="#/ch/${next.n}">অধ্যায় ${bn(next.n)} →</a>` : '<span></span>'}
  </div>`;
  const list = document.getElementById('list');
  const apply = () => {
    list.classList.toggle('hide-pr', !prefs.pr);
    list.classList.toggle('hide-bn', !prefs.bn);
    list.classList.toggle('hide-en', !prefs.en);
  };
  const progress = () => {
    const d = chDone(c.n);
    document.getElementById('bar').style.width = (100 * d / c.s.length) + '%';
    document.getElementById('cnt').textContent = `${bn(d)}/${bn(c.s.length)} শেখা হয়েছে`;
  };
  apply(); progress();
  app.querySelectorAll('.tog[data-t]').forEach(b => b.onclick = () => {
    const k = b.dataset.t; prefs[k] = !prefs[k]; store.set('prefs', prefs);
    b.setAttribute('aria-pressed', prefs[k]); apply();
  });
  let playing = false;
  document.getElementById('all').onclick = function(){
    if (playing) { playing = false; speechSynthesis.cancel(); this.textContent = '▶ সব শুনুন'; return; }
    playing = true; this.textContent = '■ থামান';
    const run = i => {
      if (!playing || i >= c.s.length) { playing = false; this.textContent = '▶ সব শুনুন'; return; }
      const card = list.children[i]; card.scrollIntoView({block:'center', behavior:'smooth'});
      const u = new SpeechSynthesisUtterance(c.s[i][0]); u.lang = 'en-US'; u.rate = 0.9;
      u.onend = () => setTimeout(() => run(i + 1), 700); u.onerror = () => { playing = false; };
      speechSynthesis.speak(u);
    };
    speechSynthesis.cancel(); run(0);
  };
  list.onclick = bindList(progress);
  window.scrollTo(0, 0);
}

function bindList(after){
  return e => {
    const card = e.target.closest('.s'); if (!card) return;
    const ci = +card.dataset.c, i = +card.dataset.i, s = byNum[ci].s[i];
    const btn = e.target.closest('[data-act]');
    if (btn && btn.dataset.act === 'say') return speak(s[0], btn);
    if (btn && btn.dataset.act === 'known') {
      const key = ci + ':' + i;
      if (known[key]) delete known[key]; else known[key] = 1;
      store.set('known', known);
      card.classList.toggle('known', !!known[key]); btn.classList.toggle('on', !!known[key]);
      return after && after();
    }
    const blur = e.target.closest('.bnm, .en');
    if (blur) blur.classList.toggle('show');
  };
}

function route(){
  speechSynthesis && speechSynthesis.cancel();
  known = store.get('known', {});
  const m = location.hash.match(/^#\/ch\/(\d+)/);
  if (m) chapter(+m[1]); else home();
  const res = document.getElementById('results');
  if (res) res.onclick = bindList(null);
}
addEventListener('hashchange', route);
route();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
</body>
</html>
